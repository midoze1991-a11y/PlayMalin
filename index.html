<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lughz</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#2b2118;--accent:#f26b1d;--ok:#1f9d63;--bad:#d64545;--muted:#8d7f72;--soft:#ffe9d6}
@media (prefers-color-scheme:dark){:root{--bg:#1a1410;--card:#261d16;--ink:#fbefe3;--muted:#b3a393;--soft:#3b2c20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:480px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.5rem;margin:0}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border:0;border-radius:10px}
#lang{background:var(--soft);padding:6px 12px}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
#ask{text-align:center;font-weight:700;margin:14px 0 8px}
#seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin-bottom:14px}
.n{min-width:52px;height:52px;padding:0 8px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700}
.n.q{background:var(--accent);color:#fff}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:2px solid var(--soft);background:var(--card);font-size:1.1rem;text-align:center;direction:ltr}
#go{background:var(--accent);color:#fff;padding:0 18px;font-weight:700}
#hintBtn{background:var(--soft);padding:8px 14px;margin-top:10px}
#hints{list-style:none;padding:0;margin:10px 0 0}
#hints li{padding:6px 0;border-bottom:1px dashed var(--soft)}
#msg{text-align:center;font-weight:700;min-height:1.5em;margin:10px 0 0}
#share{display:none;width:100%;background:var(--ok);color:#fff;padding:12px;margin-top:10px;font-weight:700}
#back{text-align:center;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main>
  <header><h1>Lughz · لغز</h1><button id="lang"></button></header>
  <div class="card">
    <div class="stats"><span id="date"></span><span id="streak"></span><span id="tries"></span></div>
    <div id="ask"></div>
    <div id="seq"></div>
    <form id="form"><input id="inp" type="number" inputmode="numeric" autocomplete="off"><button id="go" type="submit"></button></form>
    <button id="hintBtn"></button>
    <ul id="hints"></ul>
    <div id="msg"></div>
    <button id="share"></button>
    <div id="back"></div>
  </div>
</main>
<script>
const T = {
  ar:{lang:"Français",ask:"ما الرقم التالي في المتتالية؟",go:"تحقق",hint:"تلميح",higher:"الجواب أكبر ⬆️",lower:"الجواب أصغر ⬇️",win:"أحسنت! 🎉",lose:"انتهت المحاولات. الجواب:",tries:"المحاولات",streak:"السلسلة",share:"نسخ النتيجة",copied:"تم النسخ ✅",back:"عُد غدًا للغز جديد",dir:"rtl",
    types:["نمط يعتمد على الجمع المنتظم","نمط يعتمد على الضرب","نمط فيه مربعات الأعداد","كل عدد مجموع العددين السابقين","نمط يتناوب بين الزيادة والنقصان","الفروق بين الأعداد تكبر تدريجيًا"],diff:"الفروق بين الأعداد المتتالية:"},
  fr:{lang:"English",ask:"Quel est le nombre suivant ?",go:"Valider",hint:"Indice",higher:"La réponse est plus grande ⬆️",lower:"La réponse est plus petite ⬇️",win:"Bravo ! 🎉",lose:"Perdu. La réponse :",tries:"Essais",streak:"Série",share:"Copier le résultat",copied:"Copié ✅",back:"Reviens demain pour une nouvelle énigme",dir:"ltr",
    types:["Une addition régulière","Une multiplication","Des carrés de nombres","Chaque nombre est la somme des deux précédents","Alternance d'augmentation et de diminution","Les écarts grandissent peu à peu"],diff:"Écarts entre les nombres :"},
  en:{lang:"العربية",ask:"What is the next number?",go:"Check",hint:"Hint",higher:"The answer is higher ⬆️",lower:"The answer is lower ⬇️",win:"Well done! 🎉",lose:"Game over. The answer:",tries:"Tries",streak:"Streak",share:"Copy result",copied:"Copied ✅",back:"Come back tomorrow for a new puzzle",dir:"ltr",
    types:["A steady addition","A multiplication","Squares of numbers","Each number is the sum of the previous two","Alternating up and down","The gaps keep growing"],diff:"Differences between neighbors:"}
};
const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = ymd(new Date()), yesterday = ymd(new Date(Date.now()-864e5));

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(rng){
  const r = n => Math.floor(rng()*n);
  const type = r(6); let s = [];
  if(type===0){const a=1+r(20),d=2+r(8);for(let i=0;i<6;i++)s.push(a+d*i);}
  else if(type===1){const a=1+r(4),m=2+r(2);for(let i=0;i<6;i++)s.push(a*m**i);}
  else if(type===2){const k=r(8);for(let i=1;i<=6;i++)s.push(i*i+k);}
  else if(type===3){const a=1+r(4),b=1+r(5);s=[a,b];while(s.length<6)s.push(s[s.length-1]+s[s.length-2]);}
  else if(type===4){const a=5+r(10),x=2+r(5),y=1+r(x-1);s=[a];for(let i=1;i<6;i++)s.push(s[i-1]+(i%2?x:-y));}
  else {const a=1+r(10),d=1+r(3);s=[a];for(let i=1;i<6;i++)s.push(s[i-1]+d+i-1);}
  return {type, shown:s.slice(0,5), answer:s[5]};
}
const puzzle = gen(mulberry32(Number(today.replace(/-/g,""))));

let lang = store.get("lughz_lang","ar");
let st = {date:today,tries:3,hints:0,status:"play",last:""};
try{const saved=JSON.parse(store.get("lughz_day","null"));if(saved&&saved.date===today)st=saved;}catch(e){}
let streak = Number(store.get("lughz_streak","0"));
let lastWin = store.get("lughz_lastwin","");
if(lastWin!==today && lastWin!==yesterday && streak>0){streak=0;store.set("lughz_streak","0");}
const saveDay = () => store.set("lughz_day",JSON.stringify(st));

function render(){
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  $("lang").textContent = t.lang; $("ask").textContent = t.ask; $("go").textContent = t.go;
  $("hintBtn").textContent = t.hint;
  $("date").textContent = today; $("streak").textContent = t.streak+": "+streak;
  $("tries").textContent = t.tries+": "+"❤️".repeat(st.tries)+"🖤".repeat(3-st.tries);
  $("seq").innerHTML = puzzle.shown.map(n=>'<div class="n">'+n+'</div>').join("")+'<div class="n q">'+(st.status==="play"?"?":puzzle.answer)+'</div>';
  const hs = [];
  if(st.hints>=1) hs.push("💡 "+t.types[puzzle.type]);
  if(st.hints>=2) hs.push("💡 "+t.diff+" "+puzzle.shown.slice(1).map((v,i)=>v-puzzle.shown[i]).join(" , "));
  $("hints").innerHTML = hs.map(h=>"<li>"+h+"</li>").join("");
  const playing = st.status==="play";
  $("form").style.display = playing ? "flex" : "none";
  $("hintBtn").style.display = (playing && st.hints<2) ? "inline-block" : "none";
  $("share").style.display = playing ? "none" : "block"; $("share").textContent = t.share;
  $("back").textContent = playing ? "" : t.back;
  $("msg").textContent = st.status==="win" ? t.win : st.status==="lose" ? t.lose+" "+puzzle.answer : st.last ? t[st.last] : "";
}
$("form").onsubmit = e => {
  e.preventDefault();
  if(st.status!=="play") return;
  const v = $("inp").value.trim(); if(v==="") return;
  $("inp").value = "";
  if(Number(v)===puzzle.answer){
    st.status = "win";
    streak = lastWin===yesterday ? streak+1 : 1; lastWin = today;
    store.set("lughz_streak",String(streak)); store.set("lughz_lastwin",today);
  } else {
    st.tries--;
    st.last = Number(v)<puzzle.answer ? "higher" : "lower";
    if(st.tries<=0){st.status="lose";streak=0;store.set("lughz_streak","0");}
  }
  saveDay(); render();
};
$("hintBtn").onclick = () => { if(st.hints<2){st.hints++;saveDay();render();} };
$("lang").onclick = () => { lang = {ar:"fr",fr:"en",en:"ar"}[lang]; store.set("lughz_lang",lang); render(); };
$("share").onclick = () => {
  const used = 3-st.tries;
  const txt = "Lughz "+today+" "+(st.status==="win"?"✅":"❌")+" "+(used+(st.status==="win"?1:0))+"/3 💡"+st.hints;
  const done = () => { $("share").textContent = T[lang].copied; };
  try{ navigator.clipboard.writeText(txt).then(done,()=>prompt("",txt)); }catch(e){ prompt("",txt); }
};
render();
</script>
</body>
</html>
